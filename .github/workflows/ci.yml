name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - cc: gcc
            cxx: g++
            build_type: Debug
          - cc: gcc
            cxx: g++
            build_type: Release
          - cc: clang
            cxx: clang++
            build_type: Debug
          - cc: clang
            cxx: clang++
            build_type: Release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0, Node 24
        with:
          submodules: recursive
      - name: Prepare pinned Bash reference
        run: |
          reference_bash=$(./scripts/prepare-reference-bash)
          printf 'SHELLCLAVE_REFERENCE_BASH=%s\n' "$reference_bash" >> "$GITHUB_ENV"
      - name: Configure
        run: >-
          cmake -S . -B build -DSHELLCLAVE_BASH_EXECUTABLE="$SHELLCLAVE_REFERENCE_BASH"
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_C_COMPILER=${{ matrix.cc }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test, install, and consume
        run: |
          # Avoid glibc's leaked LOCPATH scratch buffer in newlocale(). This
          # installs data on the ephemeral runner, not global locale settings.
          sudo localedef -i en_DK -f UTF-8 en_DK.UTF-8
          ctest --test-dir build --output-on-failure

  sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0, Node 24
        with:
          submodules: recursive
      - name: Prepare pinned Bash reference
        run: |
          reference_bash=$(./scripts/prepare-reference-bash)
          printf 'SHELLCLAVE_REFERENCE_BASH=%s\n' "$reference_bash" >> "$GITHUB_ENV"
      - run: >-
          cmake -S . -B build -DSHELLCLAVE_BASH_EXECUTABLE="$SHELLCLAVE_REFERENCE_BASH" -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          -DSHELLCLAVE_ENABLE_SANITIZERS=ON
      - run: cmake --build build --parallel 2
      - run: |
          sudo localedef -i en_DK -f UTF-8 en_DK.UTF-8
          ctest --test-dir build --output-on-failure

  thread-sanitizer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0, Node 24
        with:
          submodules: recursive
      - name: Prepare pinned Bash reference
        run: |
          reference_bash=$(./scripts/prepare-reference-bash)
          printf 'SHELLCLAVE_REFERENCE_BASH=%s\n' "$reference_bash" >> "$GITHUB_ENV"
      - run: >-
          cmake -S . -B build -DSHELLCLAVE_BASH_EXECUTABLE="$SHELLCLAVE_REFERENCE_BASH" -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          -DSHELLCLAVE_ENABLE_TSAN=ON
      - run: >-
          cmake --build build --parallel 2
          --target shellclave_concurrency_tests
      - run: >-
          ctest --test-dir build -L '^concurrency$' --no-tests=error
          --output-on-failure --parallel 1

  static-analysis:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0, Node 24
        with:
          submodules: recursive
      - name: Prepare pinned Bash reference
        run: |
          reference_bash=$(./scripts/prepare-reference-bash)
          printf 'SHELLCLAVE_REFERENCE_BASH=%s\n' "$reference_bash" >> "$GITHUB_ENV"
      - name: Install Clang Static Analyzer and formatter
        run: |
          sudo apt-get update
          sudo apt-get install --yes wget ca-certificates gnupg lsb-release
          sudo mkdir -p /usr/share/keyrings
          LLVM_KEY_FILE="$(mktemp)"
          cleanup_llvm_key() { rm -f "$LLVM_KEY_FILE"; }
          trap cleanup_llvm_key EXIT
          wget -qO "$LLVM_KEY_FILE" https://apt.llvm.org/llvm-snapshot.gpg.key
          gpg --dearmor < "$LLVM_KEY_FILE" \
            | sudo tee /usr/share/keyrings/llvm-toolchain-21.gpg >/dev/null
          source /etc/os-release
          LLVM_DISTRO="${VERSION_CODENAME:-$(lsb_release -sc)}"
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/llvm-toolchain-21.gpg] https://apt.llvm.org/${LLVM_DISTRO}/ llvm-toolchain-${LLVM_DISTRO}-21 main" \
            | sudo tee /etc/apt/sources.list.d/llvm-toolchain-21.list >/dev/null
          sudo apt-get update
          sudo apt-get install --yes clang-format-21 clang-tools-21
      - name: Configure
        run: cmake -S . -B build -DSHELLCLAVE_BASH_EXECUTABLE="$SHELLCLAVE_REFERENCE_BASH"
      - name: Check formatting
        run: cmake --build build --target format-check
      - name: Analyze
        run: cmake --build build --target clang-analyze

  fuzz-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0, Node 24
        with:
          submodules: recursive
      - run: >-
          cmake -S . -B build -DBUILD_TESTING=OFF
          -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          -DSHELLCLAVE_BUILD_FUZZERS=ON
      - run: cmake --build build --parallel 2
      - run: cmake --build build --target fuzz-smoke

  coverage-report:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0, Node 24
        with:
          submodules: recursive
      - name: Prepare pinned Bash reference
        run: |
          reference_bash=$(./scripts/prepare-reference-bash)
          printf 'SHELLCLAVE_REFERENCE_BASH=%s\n' "$reference_bash" >> "$GITHUB_ENV"
      # Pin the parser behavior used by the report commands below. GCC can
      # emit both wrapped negative counters and counters above 2^32; gcovr
      # 8.6 can handle both warning classes in one invocation.
      - run: python3 -m pip install gcovr==8.6
      - run: >-
          cmake -S . -B build -DSHELLCLAVE_BASH_EXECUTABLE="$SHELLCLAVE_REFERENCE_BASH" -DCMAKE_BUILD_TYPE=Debug
          -DSHELLCLAVE_ENABLE_COVERAGE=ON
          -DSHELLCLAVE_COVERAGE_VARIANT=tests
      - run: cmake --build build --parallel 2
      - run: |
          sudo localedef -i en_DK -f UTF-8 en_DK.UTF-8
          ctest --test-dir build --output-on-failure
      - name: Produce Shellsplit coverage reports
        run: >-
          gcovr --root . --filter shellsplit/src --print-summary
          --merge-mode-functions=merge-use-line-min
          --gcov-ignore-parse-errors=negative_hits.warn_once_per_file
          --gcov-ignore-parse-errors=suspicious_hits.warn_once_per_file
          --fail-under-line 93 --fail-under-branch 80 --fail-under-function 100
          --txt=shellsplit-coverage.txt --xml-pretty
          --xml=shellsplit-coverage.xml
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0, Node 24
        with:
          name: shellsplit-coverage
          path: |
            shellsplit-coverage.txt
            shellsplit-coverage.xml
      - name: Produce Shelltype coverage reports
        run: >-
          gcovr --root . --filter shelltype/src --print-summary
          --merge-mode-functions=merge-use-line-min
          --gcov-ignore-parse-errors=negative_hits.warn_once_per_file
          --gcov-ignore-parse-errors=suspicious_hits.warn_once_per_file
          --fail-under-line 91 --fail-under-branch 82 --fail-under-function 100
          --txt=coverage.txt --xml-pretty --xml=coverage.xml
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0, Node 24
        with:
          name: shelltype-coverage
          path: |
            coverage.txt
            coverage.xml
      - name: Produce Shellgate coverage reports
        run: >-
          gcovr --root . --filter shellgate/src --print-summary
          --merge-mode-functions=merge-use-line-min
          --gcov-ignore-parse-errors=negative_hits.warn_once_per_file
          --gcov-ignore-parse-errors=suspicious_hits.warn_once_per_file
          --fail-under-line 93 --fail-under-branch 77 --fail-under-function 100
          --txt=shellgate-coverage.txt --xml-pretty
          --xml=shellgate-coverage.xml
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0, Node 24
        with:
          name: shellgate-coverage
          path: |
            shellgate-coverage.txt
            shellgate-coverage.xml

  production-coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0, Node 24
        with:
          submodules: recursive
      - name: Prepare pinned Bash reference
        run: |
          reference_bash=$(./scripts/prepare-reference-bash)
          printf 'SHELLCLAVE_REFERENCE_BASH=%s\n' "$reference_bash" >> "$GITHUB_ENV"
      - run: python3 -m pip install gcovr==8.6
      # Report shipping CFGs separately. Fault-injection and production block
      # identities are different and must never share a coverage denominator.
      - run: >-
          cmake -S . -B build -DSHELLCLAVE_BASH_EXECUTABLE="$SHELLCLAVE_REFERENCE_BASH" -DCMAKE_BUILD_TYPE=Debug
          -DSHELLCLAVE_ENABLE_COVERAGE=ON
          -DSHELLCLAVE_COVERAGE_VARIANT=production
      - run: >-
          cmake --build build --parallel 2 --target
          shellclave_production_tests
      - run: ctest --test-dir build -L '^production$' --no-tests=error --output-on-failure
      - name: Report production implementation coverage
        run: |
          for component in shellsplit shelltype shellgate; do
            gcovr --root . --filter "$component/src" --print-summary \
              --merge-mode-functions=merge-use-line-min \
              --gcov-ignore-parse-errors=negative_hits.warn_once_per_file \
              --gcov-ignore-parse-errors=suspicious_hits.warn_once_per_file \
              --txt="production-$component-coverage.txt" --xml-pretty \
              --xml="production-$component-coverage.xml"
          done
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0, Node 24
        with:
          name: production-coverage
          path: |
            production-*-coverage.txt
            production-*-coverage.xml
